[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvd-risk"
version = "1.0.0"
description = "10-year cardiovascular death risk in US adults (NHANES 1999-2018 linked to the National Death Index), benchmarked against the Pooled Cohort Equations; plus hospital-by-hospital re-validation of an earlier 918-patient classifier"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Muneera Mohamed" }]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "joblib>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
explain = ["shap>=0.46"]
dev = ["pytest>=8", "ruff>=0.5", "shap>=0.46", "pytest-github-actions-annotate-failures>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 220
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
